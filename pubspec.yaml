name: jor_admin
description: Jor – Admin Panel
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.0
  image_picker: ^1.2.2
  http: ^1.6.0
  crypto: ^3.0.3
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/logo/
    - assets/icons/
    - assets/icon/
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: fonts/MaterialIcons-Regular.otf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/admin_app_icon.png"
  adaptive_icon_background: "#1C1A30"
  adaptive_icon_foreground: "assets/icon/admin_app_icon_foreground.png"
